# Build du site en statique et déploiement sur GitHub Pages à chaque push sur main.
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # "/nom-du-depot" pour un site de projet, vide pour <user>.github.io ou un domaine perso.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # URL publique complète, pour les métadonnées (Open Graph, hreflang).
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
